# Roda na VM 2 (192.168.1.100). Lido pelo Spring Boot ao iniciar.

# Porta do Tomcat — o Nginx da VM 1 encaminha para cá (192.168.1.100:8080)
server.port=8080

# Conexão com PostgreSQL hospedado no Neon Cloud (região sa-east-1)
spring.datasource.url=jdbc:postgresql://ep-little-surf-achre2wt.sa-east-1.aws.neon.tech:5432/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_Z2H3ndBKDUPo

# Sincroniza a entidade Transacao.java com a tabela "transacoes" no banco.
# update = cria a tabela se não existir, preserva dados existentes.
spring.jpa.hibernate.ddl-auto=update

# Dialeto PostgreSQL para geração de SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Loga os SQLs no console da VM 2 (útil para debug na apresentação)
spring.jpa.show-sql=true
