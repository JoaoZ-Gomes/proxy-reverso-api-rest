# Roda na VM 1 (192.168.1.10). Instalado em /etc/nginx/sites-available/api.
# Ativar: ln -s /etc/nginx/sites-available/api /etc/nginx/sites-enabled/api
# Testar: sudo nginx -t  |  Reiniciar: sudo systemctl restart nginx

# Backend — aponta para a API Java na VM 2
upstream api_backend {
    server 192.168.1.100:8080;
}

server {
    listen 80;
    server_name api.local;

    client_max_body_size 10M;

    access_log /var/log/nginx/api_access.log;
    error_log /var/log/nginx/api_error.log;

    # Rota genérica — fallback para qualquer path não mapeado abaixo
    location / {
        proxy_pass http://api_backend;

        # Repassa informações do cliente original para a API
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Rota /transacoes — mapeia para o TransacaoController (GET lista, POST cadastra)
    location /transacoes {
        proxy_pass http://api_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Rota /transacoes/{id} — mapeia GET/PUT/DELETE por ID no Controller
    # Regex aceita apenas IDs numéricos (ex: /transacoes/3)
    location ~ ^/transacoes/\d+$ {
        proxy_pass http://api_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Páginas de erro — 502 aparece quando a VM 2 está fora do ar
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

